# .github/workflows/deploy-cloud-function.yml
name: 🖨️ Deploy Simple Message Printer to Google Cloud Functions

on:
  push:
    branches: 
      - main 
      - develop
      - 'feature/**'
    paths:
      - 'src/**'
      - 'cloud_functions/**'
      - '.github/workflows/**'
  
  pull_request:
    branches: [ main ]
    types: [ closed ]
    
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production
      message_count:
        description: 'Number of test messages to send'
        required: false
        default: '3'
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  FUNCTION_NAME: simple-message-printer
  REGION: us-central1

jobs:
  validate:
    name: 🔍 Validate Code
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.deploy }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8
        
    - name: 🧹 Lint code
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 cloud_functions/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: 🧪 Run tests
      run: |
        pytest tests/ -v --tb=short || echo "Tests failed but continuing..."
        
    - name: ✅ Check if should deploy
      id: check
      run: |
        echo "🔍 Analyzing if we should deploy..."
        SHOULD_DEPLOY="false"
        
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          SHOULD_DEPLOY="true"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          SHOULD_DEPLOY="true"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          SHOULD_DEPLOY="true"
        elif [[ "${{ github.ref }}" == *"feature"* ]]; then
          SHOULD_DEPLOY="true"
        elif [[ "${{ github.event.pull_request.merged }}" == "true" ]]; then
          SHOULD_DEPLOY="true"
        fi
        
        echo "🎯 Should deploy: $SHOULD_DEPLOY"
        echo "deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT

  deploy:
    name: 🚀 Deploy to Cloud Functions
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.should_deploy == 'true'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: ☁️ Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: 🔧 Enable required APIs
      run: |
        echo "🔧 Enabling required APIs..."
        REQUIRED_APIS=(
          "cloudfunctions.googleapis.com"
          "cloudbuild.googleapis.com"
          "cloudresourcemanager.googleapis.com"
          "logging.googleapis.com"
        )
        
        for API in "${REQUIRED_APIS[@]}"; do
          echo "   - Enabling: $API"
          gcloud services enable "$API" --project=${{ env.PROJECT_ID }} || echo "API already enabled or permission issue"
        done
        
        echo "⏳ Waiting for API propagation..."
        sleep 15

    - name: 🔧 Determine environment
      id: env
      run: |
        if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
          ENV="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENV="production"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          ENV="staging"
        elif [[ "${{ github.ref }}" == *"feature"* ]]; then
          ENV="development"
        else
          ENV="development"
        fi
        echo "environment=${ENV}" >> $GITHUB_OUTPUT
        echo "🎯 Deploying to: ${ENV}"

    - name: 🚀 Deploy Cloud Function
      run: |
        ENV_NAME="${{ steps.env.outputs.environment }}"
        FUNCTION_NAME_ENV="${FUNCTION_NAME}-${ENV_NAME}"
        
        echo "🖨️ Deploying Simple Message Printer: ${FUNCTION_NAME_ENV}"
        
        echo "📁 Preparing files for deployment..."
        cp -r src/printer cloud_functions/
        cp -r src/utils cloud_functions/
        
        echo "# Clean __init__.py for Cloud Functions" > cloud_functions/printer/__init__.py
        echo "# Clean __init__.py for Cloud Functions" > cloud_functions/utils/__init__.py
        
        echo "📋 Verifying critical files..."
        CRITICAL_FILES=(
          "cloud_functions/printer/message_printer.py"
          "cloud_functions/printer/config.py"
          "cloud_functions/utils/logger.py"
          "cloud_functions/main.py"
        )
        
        for file in "${CRITICAL_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file MISSING"
            exit 1
          fi
        done
        
        cd cloud_functions/
        
        echo "📂 Final structure:"
        ls -la
        
        echo "🚀 Starting deployment..."
        gcloud functions deploy ${FUNCTION_NAME_ENV} \
          --gen2 \
          --runtime=python311 \
          --source=. \
          --entry-point=simple_message_printer \
          --trigger-http \
          --allow-unauthenticated \
          --set-env-vars="LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }},ENVIRONMENT=${ENV_NAME},DEFAULT_MESSAGE=${{ secrets.DEFAULT_MESSAGE || 'Hello from Cloud Function!' }},DEFAULT_USER=${{ secrets.DEFAULT_USER || 'Cloud' }},MESSAGE_PREFIX=${{ secrets.MESSAGE_PREFIX || '🖨️' }},DEPLOYED_BY=github-actions,COMMIT_SHA=${{ github.sha }},BRANCH=${{ github.ref_name }}" \
          --memory=512Mi \
          --timeout=60s \
          --max-instances=10 \
          --min-instances=0 \
          --region=${{ env.REGION }} \
          --quiet
          
        if [ $? -eq 0 ]; then
          echo "✅ Deployment successful"
        else
          echo "❌ Deployment failed"
          exit 1
        fi

    - name: 🌐 Get function URL
      id: get_url
      run: |
        ENV_NAME="${{ steps.env.outputs.environment }}"
        FUNCTION_NAME_ENV="${FUNCTION_NAME}-${ENV_NAME}"
        
        FUNCTION_URL=$(gcloud functions describe ${FUNCTION_NAME_ENV} \
          --gen2 \
          --region=${{ env.REGION }} \
          --format="value(serviceConfig.uri)")
        
        echo "url=${FUNCTION_URL}" >> $GITHUB_OUTPUT
        echo "🌐 Function URL: ${FUNCTION_URL}"
        echo "✅ Function deployed successfully and publicly accessible"

    - name: 🧪 Test deployed function
      run: |
        FUNCTION_URL="${{ steps.get_url.outputs.url }}"
        MESSAGE_COUNT="${{ github.event.inputs.message_count || '3' }}"
        
        echo "🧪 Testing deployed function..."
        echo "🎯 Function URL: $FUNCTION_URL"
        
        echo "🧪 TEST 1: Simple message"
        RESPONSE1=$(curl -s -w "%{http_code}" -X POST "$FUNCTION_URL" \
          -H "Content-Type: application/json" \
          -d '{"mode": "simple", "message": "Hello from GitHub Actions!", "user": "CI/CD"}' \
          -o test1_response.json)
        
        HTTP_CODE1=${RESPONSE1: -3}
        echo "   📊 HTTP Status: $HTTP_CODE1"
        
        if [ "$HTTP_CODE1" -eq 200 ]; then
          echo "   ✅ Simple test successful"
          cat test1_response.json | jq . 2>/dev/null || cat test1_response.json
        else
          echo "   ❌ Simple test failed"
          cat test1_response.json 2>/dev/null || echo "No response body"
        fi
        
        echo ""
        echo "🧪 TEST 2: Multiple messages"
        RESPONSE2=$(curl -s -w "%{http_code}" -X POST "$FUNCTION_URL" \
          -H "Content-Type: application/json" \
          -d "{\"mode\": \"multiple\", \"message\": \"CI/CD Test\", \"count\": $MESSAGE_COUNT, \"user\": \"GitHub Actions\"}" \
          -o test2_response.json)
        
        HTTP_CODE2=${RESPONSE2: -3}
        echo "   📊 HTTP Status: $HTTP_CODE2"
        
        if [ "$HTTP_CODE2" -eq 200 ]; then
          echo "   ✅ Multiple messages test successful"
          cat test2_response.json | jq . 2>/dev/null || cat test2_response.json
        else
          echo "   ❌ Multiple messages test failed"
          cat test2_response.json 2>/dev/null || echo "No response body"
        fi
        
        echo ""
        echo "🧪 TEST 3: Environment info"
        RESPONSE3=$(curl -s -w "%{http_code}" -X POST "$FUNCTION_URL" \
          -H "Content-Type: application/json" \
          -d '{"mode": "environment"}' \
          -o test3_response.json)
        
        HTTP_CODE3=${RESPONSE3: -3}
        echo "   📊 HTTP Status: $HTTP_CODE3"
        
        if [ "$HTTP_CODE3" -eq 200 ]; then
          echo "   ✅ Environment test successful"
          cat test3_response.json | jq . 2>/dev/null || cat test3_response.json
        else
          echo "   ❌ Environment test failed"
          cat test3_response.json 2>/dev/null || echo "No response body"
        fi
        
        rm -f test1_response.json test2_response.json test3_response.json
        echo "✅ All tests completed"

    - name: 📊 Deployment Summary
      run: |
        ENV_NAME="${{ steps.env.outputs.environment }}"
        FUNCTION_NAME_ENV="${FUNCTION_NAME}-${ENV_NAME}"
        FUNCTION_URL="${{ steps.get_url.outputs.url }}"
        
        echo "## 🖨️ Simple Message Printer Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🎯 Environment | \`${ENV_NAME}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Function Name | \`${FUNCTION_NAME_ENV}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🌐 Function URL | ${FUNCTION_URL} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔧 Region | \`${{ env.REGION }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 📝 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🌿 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 How to use the function:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "# Simple message" >> $GITHUB_STEP_SUMMARY
        echo "curl -X POST \"${FUNCTION_URL}\" \\" >> $GITHUB_STEP_SUMMARY
        echo "  -H \"Content-Type: application/json\" \\" >> $GITHUB_STEP_SUMMARY
        echo "  -d '{\"mode\": \"simple\", \"message\": \"Hello World!\", \"user\": \"YourName\"}'" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Multiple messages" >> $GITHUB_STEP_SUMMARY
        echo "curl -X POST \"${FUNCTION_URL}\" \\" >> $GITHUB_STEP_SUMMARY
        echo "  -H \"Content-Type: application/json\" \\" >> $GITHUB_STEP_SUMMARY
        echo "  -d '{\"mode\": \"multiple\", \"message\": \"Test\", \"count\": 3, \"user\": \"YourName\"}'" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Environment info" >> $GITHUB_STEP_SUMMARY
        echo "curl -X POST \"${FUNCTION_URL}\" \\" >> $GITHUB_STEP_SUMMARY
        echo "  -H \"Content-Type: application/json\" \\" >> $GITHUB_STEP_SUMMARY
        echo "  -d '{\"mode\": \"environment\"}'" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  notify:
    name: 📢 Notify Results
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: always()
    
    steps:
    - name: 📢 Deployment Status
      run: |
        if [[ "${{ needs.deploy.result }}" == "success" ]]; then
          echo "✅ Deployment successful!"
          echo "🖨️ Simple Message Printer is now live"
        elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
          echo "❌ Deployment failed!"
        elif [[ "${{ needs.validate.outputs.should_deploy }}" == "false" ]]; then
          echo "⏭️ Deployment skipped (no deployment needed)"
        else
          echo "❓ Deployment status unknown"
        fi